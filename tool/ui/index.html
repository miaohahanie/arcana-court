<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铭刻室 · ARCANA COURT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <header class="bar">
    <div class="brand">✦ 铭刻室 <span>ARCANA COURT</span></div>
    <nav class="tabs">
      <button class="tab active" data-view="list">卷轴列表</button>
      <button class="tab" data-view="settings">设置</button>
    </nav>
    <div class="bar-right">
      <span class="proj" id="projName" title=""></span>
      <button class="mini" id="btnOpenBlog" title="打开线上博客">↗ 线上</button>
    </div>
  </header>

  <!-- 卷轴列表 -->
  <main id="viewList" class="view">
    <div class="list-head">
      <div class="list-stats" id="listStats"></div>
      <div class="list-actions">
        <button class="ghost" id="btnRetry" hidden>⟳ 补推待推送</button>
        <button class="cast" id="btnNew">✎ 新卷轴</button>
      </div>
    </div>
    <div id="postList" class="post-list"></div>
  </main>

  <!-- 编辑器 -->
  <main id="viewEditor" class="view" hidden>
    <div class="editor-top">
      <button class="ghost" id="btnBack">← 返回列表</button>
      <div class="editor-stats" id="edStats"></div>
      <button class="cast" id="btnPublish">✦ 上传卷轴</button>
    </div>
    <div class="editor-grid">
      <section class="ed-fields">
        <label>卷轴之名
          <input id="fTitle" maxlength="60" placeholder="这一卷要讲什么？">
        </label>
        <div class="row4">
          <label>流派
            <input id="fTag" list="tagOptions" maxlength="12" placeholder="图形学">
            <datalist id="tagOptions"></datalist>
          </label>
          <label>日期
            <input type="date" id="fDate">
          </label>
          <label>符印
            <select id="fGlyph"></select>
          </label>
          <label>slug
            <input id="fSlug" maxlength="40" placeholder="自动生成">
          </label>
        </div>
        <label>摘要（留空自动截取）
          <textarea id="fExcerpt" rows="2" maxlength="120" placeholder="一句话引诱读者……"></textarea>
        </label>
        <label>正文（## 标题 · &gt; 引文 · - 列表 · --- 分隔 · ``` 代码 · ![图](路径) · **粗**）
          <textarea id="fBody" rows="14" placeholder="在此铭刻咒文…… 可直接拖拽或粘贴图片"></textarea>
        </label>
        <div class="img-strip" id="imgStrip">
          <span class="img-hint">图片：拖拽/粘贴到正文，或</span>
          <button class="ghost mini" id="btnPickImg">选择图片</button>
          <input type="file" id="imgFile" accept=".png,.jpg,.jpeg,.webp,.gif" multiple hidden>
        </div>
      </section>
      <section class="ed-preview">
        <p class="pv-label">PREVIEW · 显影</p>
        <div class="pv-body" id="pvBody"></div>
      </section>
    </div>
  </main>

  <!-- 设置 -->
  <main id="viewSettings" class="view" hidden>
    <div class="settings-box">
      <p class="kicker">SETTINGS · 法阵参数</p>
      <label>博客目录（含 posts.user.json）
        <input id="sProj" placeholder="例如 C:\Users\you\Desktop\_Projects\博客demo">
      </label>
      <div class="row2">
        <label>分支
          <input id="sBranch" placeholder="main">
        </label>
        <label>SSH 私钥路径
          <input id="sKey" placeholder="C:\Users\you\.ssh\arcana-court">
        </label>
      </div>
      <label class="check"><input type="checkbox" id="sAuto"> 发布后自动推送到 GitHub</label>
      <div class="set-actions">
        <button class="cast" id="btnSaveSet">保存设置</button>
        <span class="set-hint">改动即刻生效；SSH 密钥需已添加到 GitHub 账号</span>
      </div>
      <p class="set-note" id="setNote"></p>
    </div>
  </main>

  <div id="toast" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
